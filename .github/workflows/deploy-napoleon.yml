name: Deploy to Napoleon Host (FTP)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 🔨 Install Dependencies
      run: npm ci

    - name: 🏗️ Build /consultoria (página principal — sem conversão Google Ads)
      run: npm run build

- name: 🏗️ Build /consultoria2 (campanha Google Ads — com conversão)
  run: npm run build:ads

- name: 📝 Preparar página inicial da /consultoria2
  run: mv dist-ads/index-ads.html dist-ads/index.html

    - name: 📂 Deploy /consultoria via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: httpdocs/consultoria/

    - name: 📂 Deploy /consultoria2 via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist-ads/
        server-dir: httpdocs/consultoria2/
